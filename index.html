<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFB3CC">
<title>🐾 발표 횟수 기록장</title>
<style>
  :root {
    --bg: #FFE4EC; --card: #FFF7FA; --border: #FFB3CC;
    --pink: #FF8FB1; --pink-dark: #E9658F; --text: #7A2E4A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 12px 32px; background: var(--bg); color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  header { text-align: center; margin-bottom: 14px; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 30px); color: var(--pink-dark); }
  #total { margin-top: 6px; font-weight: 700; }
  #grid {
    display: grid; gap: 10px; max-width: 960px; margin: 0 auto;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  }
  .card {
    background: var(--card); border: 2px solid var(--border); border-radius: 18px;
    padding: 10px 8px 12px; text-align: center;
  }
  .animal { font-size: 30px; line-height: 1.2; }
  .num { font-weight: 700; font-size: 15px; }
  .count { font-size: 34px; font-weight: 800; color: var(--pink-dark); line-height: 1.1; }
  .count.pop { animation: pop .25s ease; }
  @keyframes pop { 50% { transform: scale(1.3); } }
  .unit { font-size: 11px; margin-bottom: 6px; }
  .btns { display: flex; justify-content: center; gap: 8px; }
  button {
    border: 0; border-radius: 12px; font: inherit; font-weight: 800; cursor: pointer;
    color: var(--text);
  }
  .btns button { width: 52px; height: 44px; font-size: 22px; }
  .minus { background: #FFD1E0; }
  .plus { background: var(--pink); color: #fff; }
  .plus:active { background: var(--pink-dark); }
  footer { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
  footer button { background: var(--pink); color: #fff; padding: 12px 20px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>🐰 우리 반 발표 횟수 🐻</h1>
  <div id="total"></div>
</header>
<main id="grid"></main>
<footer><button id="reset">🌸 전체 초기화</button></footer>

<script>
  var STUDENTS = [];
  for (var i = 1; i <= 11; i++) STUDENTS.push(i);
  for (var j = 31; j <= 42; j++) STUDENTS.push(j);
  var ANIMALS = ["🐱","🐶","🐰","🐻","🐹","🦊","🐼","🐨","🐷","🐥","🐮","🐵"];
  var KEY = "presentation-counts-v1";

  function load() {
    var counts = {};
    STUDENTS.forEach(function (n) { counts[n] = 0; });
    try {
      var saved = JSON.parse(localStorage.getItem(KEY) || "{}");
      STUDENTS.forEach(function (n) { counts[n] = parseInt(saved[n], 10) || 0; });
    } catch (e) {}
    return counts;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(counts)); } catch (e) {}
  }

  var counts = load();
  var grid = document.getElementById("grid");

  STUDENTS.forEach(function (n, idx) {
    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="animal">' + ANIMALS[idx % ANIMALS.length] + '</div>' +
      '<div class="num">' + n + '번</div>' +
      '<div class="count" id="c' + n + '">0</div>' +
      '<div class="unit">회</div>' +
      '<div class="btns">' +
        '<button class="minus" data-n="' + n + '" data-d="-1" aria-label="' + n + '번 1회 줄이기">−</button>' +
        '<button class="plus" data-n="' + n + '" data-d="1" aria-label="' + n + '번 1회 늘리기">+</button>' +
      '</div>';
    grid.appendChild(card);
  });

  function render(pop) {
    var total = 0;
    STUDENTS.forEach(function (n) {
      var el = document.getElementById("c" + n);
      el.textContent = counts[n];
      total += counts[n];
      if (pop === n) {
        el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
      }
    });
    document.getElementById("total").textContent = "✨ 전체 발표 횟수: " + total + "회 ✨";
  }

  grid.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-n]");
    if (!b) return;
    var n = parseInt(b.dataset.n, 10), d = parseInt(b.dataset.d, 10);
    counts[n] = Math.max(0, counts[n] + d);
    save(); render(n);
  });

  document.getElementById("reset").addEventListener("click", function () {
    if (confirm("모든 학생의 발표 횟수를 0으로 되돌릴까요?")) {
      STUDENTS.forEach(function (n) { counts[n] = 0; });
      save(); render();
    }
  });

  render();
</script>
</body>
</html>
